# Relevés isolés : un process par source.
# Gîtes / Abritel / centrale : Chromium Playwright (image commune).
# Airbnb : pyairbnb (image Python scrape/airbnb).
# Booking : stealth Python (invisible_playwright → Camoufox → SeleniumBase UC).
#
#   docker compose -f scrape/docker-compose.yml up --build -d
#
# L’app détecte les workers sains et s’en sert. Éteints = relevé local.

x-worker: &worker
  build:
    context: ..
    dockerfile: scrape/Dockerfile
  init: true
  shm_size: 1gb
  mem_limit: 2g
  restart: unless-stopped
  environment:
    PORT: "8080"
    SKITRACK_SCRAPE_PROFILE: /data/profile
    OMKAR_API_KEY: ${OMKAR_API_KEY:-}
    OMKAR_AIRBNB_KEY: ${OMKAR_AIRBNB_KEY:-}
    OMKAR_BOOKING_KEY: ${OMKAR_BOOKING_KEY:-}
    BRIGHTDATA_BROWSER_WS: ${BRIGHTDATA_BROWSER_WS:-}
    SKITRACK_PROXY: ${SKITRACK_PROXY:-}
    SKITRACK_PROXY_LIST: ${SKITRACK_PROXY_LIST:-}
    SKITRACK_PROXY_MODE: ${SKITRACK_PROXY_MODE:-}

services:
  scrape-booking:
    build:
      context: ..
      dockerfile: scrape/booking/Dockerfile
    init: true
    shm_size: 2gb
    mem_limit: 3g
    restart: unless-stopped
    environment:
      SOURCE: booking-web
      PORT: "8080"
      SKITRACK_PROXY: ${SKITRACK_PROXY:-}
      SKITRACK_PROXY_LIST: ${SKITRACK_PROXY_LIST:-}
      SKITRACK_PROXY_MODE: ${SKITRACK_PROXY_MODE:-}
      SKITRACK_MOBILE_PROXY: ${SKITRACK_MOBILE_PROXY:-}
      CRAWLBASE_TOKEN: ${CRAWLBASE_TOKEN:-}
      SCRAPINGBEE_API_KEY: ${SCRAPINGBEE_API_KEY:-}
      SKITRACK_BOOKING_ENGINES: ${SKITRACK_BOOKING_ENGINES:-crawlbase,scrapingbee,invisible_playwright,camoufox,seleniumbase_uc}
      SKITRACK_BOOKING_CRAWL_DELAY: ${SKITRACK_BOOKING_CRAWL_DELAY:-1.5}
    ports:
      - "127.0.0.1:18701:8080"


  scrape-gites:
    build:
      context: ..
      dockerfile: scrape/gites/Dockerfile
    init: true
    shm_size: 2gb
    mem_limit: 2g
    restart: unless-stopped
    environment:
      SOURCE: gites-web
      PORT: "8080"
      SKITRACK_GITES_ENGINE: ${SKITRACK_GITES_ENGINE:-crawlbase}
      CRAWLBASE_TOKEN: ${CRAWLBASE_TOKEN:-}
      CRAWLBASE_JS_TOKEN: ${CRAWLBASE_JS_TOKEN:-}
      SKITRACK_PROXY: ${SKITRACK_PROXY:-}
    ports:
      - "127.0.0.1:18702:8080"

  scrape-abritel:
    build:
      context: ..
      dockerfile: scrape/abritel/Dockerfile
    init: true
    shm_size: 2gb
    mem_limit: 2g
    restart: unless-stopped
    environment:
      SOURCE: vrbo-web
      PORT: "8080"
    ports:
      - "127.0.0.1:18703:8080"

  scrape-airbnb:
    build:
      context: ..
      dockerfile: scrape/airbnb/Dockerfile
    init: true
    mem_limit: 1g
    restart: unless-stopped
    environment:
      SOURCE: airbnb
      PORT: "8080"
      SKITRACK_PROXY: ${SKITRACK_PROXY:-}
      SKITRACK_PROXY_LIST: ${SKITRACK_PROXY_LIST:-}
      SKITRACK_PROXY_MODE: ${SKITRACK_PROXY_MODE:-}
    ports:
      - "127.0.0.1:18704:8080"

  scrape-station:
    <<: *worker
    environment:
      SOURCE: station-web
      PORT: "8080"
      SKITRACK_SCRAPE_PROFILE: /data/profile
      SKITRACK_PROXY: ${SKITRACK_PROXY:-}
      SKITRACK_PROXY_LIST: ${SKITRACK_PROXY_LIST:-}
      SKITRACK_PROXY_MODE: ${SKITRACK_PROXY_MODE:-}
    ports:
      - "127.0.0.1:18705:8080"
