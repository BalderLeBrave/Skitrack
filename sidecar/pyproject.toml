[project]
name = "skitrack-sidecar"
version = "0.1.0"
description = "SKITRACK — sidecar métier (FastAPI) : référentiel domaines skiables, altimétrie, itinéraires, providers logement."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "ijson>=3.3",
    "PyYAML>=6.0",
    "shapely>=2.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
skitrack-sidecar = "skitrack.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skitrack*"]

[tool.setuptools.package-data]
skitrack = ["providers/*.yaml", "data/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
