# Correspondance code ISO 3166-2 -> massif.
#
# OpenSkiMap ne fournit pas de notion de massif : il donne un pays, une région et
# un code ISO 3166-2 (« FR-73 »). Cette table sert à reconstituer le massif, qui
# est la maille de raisonnement naturelle quand on cherche de la neige.
#
# Limite assumée : un département n'est pas un massif. L'Isère (FR-38) contient
# l'Oisans (Alpes du Nord) *et* le Vercors ; la Drôme (FR-26) contient le Vercors
# sud et le Diois. On classe au plus fréquent et on corrige au cas par cas dans
# data/curated/domains_fr.yaml, qui gagne toujours.

by_admin_code:
  # --- France : Alpes du Nord ---
  FR-74: Alpes du Nord
  FR-73: Alpes du Nord
  FR-38: Alpes du Nord

  # --- France : Alpes du Sud ---
