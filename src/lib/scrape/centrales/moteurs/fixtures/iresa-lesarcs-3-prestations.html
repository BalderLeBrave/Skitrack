e personne<br />Le couchage en hauteur ne convient pas aux enfants de moins de 6 ans<br /> <br />Les sanitaires<br />L'appartement est équipé d'une salle de bains avec baignoire et un WC<br /><br />Coin cuisine ouvert sur séjour<br />Il est entièrement équipé avec des plaques électriques, un four, un micro-ondes, un lave-vaisselle et un réfrigérateur<br /><br />Les équipements complémentaires<br />Une télévision <br />accès wifi:réseau varet 2 et la clé varet 538<br /><br />Informations supplémentaires<br />Nos amis les animaux ne sont pas tolérés dans cet appartement<br />Le linge de lit est inclus sauf pour les courts séjours et en été","exposition":"Sud","cap_max":"5","surface":"28","stars":0,"photos":[{"url":"/output/information/prestation/893/F2C_PHOTOS_HBGT-RUB_PHOTO_1_HBGT-0190010742_01.jpg","alt":""},{"url":"/output/information/prestation/893/F2C_PHOTOS_HBGT-RUB_PHOTO_2_HBGT-0190010742_02.jpg","alt":""},{"url":"/output/information/prestation/893/F2C_PHOTOS_HBGT-RUB_PHOTO_3_HBGT-0190010742_03.jpg","alt":""},{"url":"/output/information/prestation/893/F2C_PHOTOS_HBGT-RUB_PHOTO_4_HBGT-0190010742_04.jpg","alt":""},{"url":"/output/information/prestation/893/F2C_PHOTOS_HBGT-RUB_PHOTO_5_HBGT-0190010742_05.jpg","alt":""},{"url":"/output/information/prestation/893/F2C_PHOTOS_HBGT-RUB_PHOTO_6_HBGT-0190010742_06.jpg","alt":""},{"url":"/output/information/prestation/893/F2C_PHOTOS_HBGT-RUB_PHOTO_7_HBGT-0190010742_07.jpg","alt":""},{"url":"/output/information/prestation/893/F2C_PHOTOS_HBGT-RUB_PHOTO_8_HBGT-0190010742_08.jpg","alt":""},{"url":"/output/information/prestation/893/F2C_PHOTOS_HBGT-RUB_PHOTO_9_HBGT-0190010742_09.jpg","alt":""},{"url":"/output/information/prestation/893/F2C_PHOTOS_HBGT-RUB_PHOTO_10_HBGT-0190010742_10.jpg","alt":""},{"url":"/output/information/prestation/893/F2C_PHOTOS_HBGT-RUB_PHOTO_11_HBGT-0190010742_11.jpg","alt":""},{"url":"/output/information/prestation/893/F2C_PHOTOS_HBGT-RUB_PHOTO_12_HBGT-0190010742_12.jpg","alt":""}],"date_debut":"2027-02
