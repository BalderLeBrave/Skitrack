<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP stricte : le renderer ne charge de script que depuis lui-même. Les
      polices et la bibliothèque de carte sont empaquetées, aucune n'est tirée
      d'un CDN. `connect-src` n'ouvre que ce dont la carte a besoin : les cinq
      fonds du sélecteur (IGN Géoplateforme, OpenTopoMap, Esri, CARTO), les
      glyphes de labels, le modèle numérique de terrain pour le relief 3D,
      Overpass pour le tracé des pistes et la vérification des positions, OSRM
      pour les temps de trajet, et Open-Meteo pour la neige et l'altimétrie.

      `img-src https:` est volontairement large : les logos des stations et les
      photos des annonces importées viennent de centaines d'hôtes qu'on ne peut
      pas énumérer. Une image ne s'exécute pas — `script-src` et `connect-src`
      restent, eux, strictement fermés.

      `frame-src` liste nommément les hébergeurs des webcams affichées dans la
      fiche domaine. Une iframe exécute du script tiers : la liste est donc
      close et alignée sur la table de `data/webcams.ts`, jamais élargie à
      `https:`. Le bulletin d'avalanche Météo-France n'y figure pas — il est lu
      par le processus main, pour que la clé d'API ne descende pas ici.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; frame-src https://www.skaping.com https://app.webcam-hd.com https://tignes.roundshot.com https://pv.viewsurf.com https://www.vision-environnement.com https://www.stationsnicecotedazur.com; connect-src 'self' http://127.0.0.1:* ws://localhost:* https://*.opentopomap.org https://*.tile.openstreetmap.org https://data.geopf.fr https://server.arcgisonline.com https://*.basemaps.cartocdn.com https://s3.amazonaws.com https://demotiles.maplibre.org https://router.project-osrm.org https://overpass-api.de https://overpass.kumi.systems https://api.open-meteo.com"
    />
    <title>SKITRACK</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
